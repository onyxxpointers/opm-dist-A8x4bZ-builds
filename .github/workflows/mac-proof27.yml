name: mac-proof27
on: workflow_dispatch
jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            ffarch: arm64
          - arch: x86_64
            runner: macos-15-intel
            ffarch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Clone app source (read-only deploy key)
        env:
          KEY: ${{ secrets.MAC_PROOF_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/macproof
          chmod 600 ~/.ssh/macproof
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/macproof -o IdentitiesOnly=yes"
          git clone git@github.com:onyxxpointers/opmspoofer.git src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r src/requirements.txt
      - name: FFmpeg
        run: |
          set -euo pipefail
          base="https://ffmpeg.martin-riedl.de/redirect/latest/macos/${{ matrix.ffarch }}/snapshot"
          for tool in ffmpeg ffprobe; do
            curl -fL --retry 3 -o "$tool.zip" "$base/$tool.zip"
            unzip -o -q "$tool.zip"; rm -f "$tool.zip"; chmod +x "$tool"
          done
          mv ffmpeg ffprobe src/
      - name: Loopback licence sheet + secrets_local
        run: |
          set -euo pipefail
          mkdir -p sheet
          printf 'owner,key\nCI Owner,DUMMY-KEY-1234\n' > sheet/keys.csv
          ( cd sheet && nohup python -m http.server 8732 --bind 127.0.0.1 >/dev/null 2>&1 & echo $! > sheet.pid )
          printf 'LICENSE_SHEET_URL = "http://127.0.0.1:8732/keys.csv"\n' > src/secrets_local.py
      - name: Real cloud update on camera (3.8.32 -> cloud latest)
        run: |
          set -uo pipefail
          set +e
          cd src
          mkdir -p ../proof
          ARCH="$(uname -m)"
          C32=$(git log -S "return '3.8.32'" --format=%H -- OPSuperSpoofer.py | tail -n 1)
          echo "start commit: $C32"
          git checkout "$C32"
          grep -n "return '3.8.32'" OPSuperSpoofer.py
          python -m PyInstaller --noconfirm --windowed --name opmspoofer \
            --add-data "logo.jpeg:." --icon logo.ico --clean \
            --hidden-import numpy.core._dtype_ctypes --hidden-import secrets_local \
            --add-binary "ffmpeg:." --add-binary "ffprobe:." OPSuperSpoofer.py
          chmod +x dist/opmspoofer.app/Contents/MacOS/opmspoofer
          FAKE="$RUNNER_TEMP/FakeApps"; rm -rf "$FAKE"; mkdir -p "$FAKE"
          cp -R dist/opmspoofer.app "$FAKE/opmspoofer.app"
          screencapture -x -v -V 480 ../proof/raw-${ARCH}.mov &
          REC=$!
          ( for i in $(seq 1 300); do screencapture -x "../proof/frame-${ARCH}-$(printf '%03d' "$i").png" 2>/dev/null; sleep 1; done ) &
          BURST=$!
          # app exactly as a real user has it: 3.8.32, default cloud feed, no overrides
          "$FAKE/opmspoofer.app/Contents/MacOS/opmspoofer" &
          APP=$!
          sleep 12
          brew list cliclick >/dev/null 2>&1 || brew install cliclick >/dev/null 2>&1 || true
          if [ "$ARCH" = "x86_64" ]; then sudo -n cliclick kp:return || true; sleep 4; sudo -n cliclick kp:return || true; sleep 2; fi
          if [ "$ARCH" = "arm64" ]; then AC=563,320; EC=295,335; BC=580,335;
          else AC=1051,425; EC=282,361; BC=573,361; fi
          sudo -n cliclick "c:$AC" || true
          sleep 2
          if [ "$ARCH" = "x86_64" ]; then sleep 8; sudo -n cliclick "c:$AC" || true; sleep 2; sudo -n cliclick c:510,209 || true; sleep 2; fi
          if [ "$ARCH" = "x86_64" ]; then for i in $(seq 1 10); do grep -q "relaunch confirmed" "$FAKE/opmspoofer-swap.log" 2>/dev/null && break; sudo -n cliclick kp:return || true; sleep 2; done; fi
          if [ "$ARCH" = "arm64" ]; then PC=570,325; else PC=1030,395; fi
          sudo -n cliclick "c:$AC" || true
          sleep 3
          sudo -n cliclick "c:$AC" || true
          sleep 3
          sudo -n cliclick "c:$PC" || true
          sleep 3
          sudo -n cliclick "c:$PC" || true
          sleep 2
          osascript -e 'tell application "opmspoofer" to activate' 2>/dev/null || true
          sleep 2
          if [ "$ARCH" = "arm64" ]; then
            sudo -n cliclick "c:$EC" || true
            sleep 1
            sudo -n cliclick "c:$EC" || true
            sleep 1
            sudo -n cliclick "t:DUMMY-KEY-1234" || true
            sleep 3
            sudo -n cliclick kp:return || true
          else
            sudo -n cliclick kp:tab || true
            sleep 1
            sudo -n cliclick "t:DUMMY-KEY-1234" || true
            sleep 3
            sudo -n cliclick kp:return || true
          fi
          sleep 5
          if [ ! -f ~/.OnyxPointMediaSpoofer/config.json ]; then
            sudo -n cliclick "c:$BC" || true
            sleep 1
            sudo -n cliclick "c:$BC" || true
            sleep 5
          fi
          if [ ! -f ~/.OnyxPointMediaSpoofer/config.json ]; then
            mkdir -p ~/.OnyxPointMediaSpoofer
            printf '{"license_key": "DUMMY-KEY-1234", "owner_name": "CI Owner"}' > ~/.OnyxPointMediaSpoofer/config.json
            pkill -f "FakeApplications/opmspoofer.app" 2>/dev/null || true
            sleep 3
            "$FAKE/opmspoofer.app/Contents/MacOS/opmspoofer" &
            APP=$!
            sleep 2
          fi
          osascript -e 'tell application "opmspoofer" to activate' 2>/dev/null || true
          sleep 10
          # real cloud prompt accepted by real Return key events until the app's own swap log confirms relaunch
          for i in $(seq 1 60); do grep -q "relaunch confirmed" "$FAKE/opmspoofer-swap.log" 2>/dev/null && break; osascript -e 'tell application "opmspoofer" to activate' 2>/dev/null || true; sudo -n cliclick kp:return || true; sleep 3; done
          sleep 5
          PIDS=$(pgrep -f "FakeApplications/opmspoofer.app/Contents/MacOS/opmspoofer" | sort -n)
          NEWEST=$(printf "%s\n" "$PIDS" | tail -n 1)
          for pid in $PIDS; do if [ "$pid" != "$NEWEST" ]; then kill "$pid" 2>/dev/null || true; fi; done
          sleep 3
          osascript -e 'tell application "opmspoofer" to activate' 2>/dev/null || true
          sleep 2
          if [ ! -f ~/.OnyxPointMediaSpoofer/config.json ]; then
            sleep 3
            osascript -e 'tell application "opmspoofer" to activate' 2>/dev/null || true
            sleep 2
            if [ "$ARCH" = "arm64" ]; then
              sudo -n cliclick "c:$EC" || true
              sleep 1
              sudo -n cliclick "c:$EC" || true
              sleep 1
            else
              sudo -n cliclick kp:tab || true
              sleep 1
            fi
            sudo -n cliclick "t:DUMMY-KEY-1234" || true
            sleep 3
            sudo -n cliclick kp:return || true
            sleep 4
          fi
          sleep 3
          ok=0
          for i in $(seq 1 120); do
            grep -q "relaunch confirmed" "$FAKE/opmspoofer-swap.log" 2>/dev/null && { ok=1; break; }
            sleep 1
          done
          sleep 6
          cat "$FAKE/opmspoofer-swap.log" 2>/dev/null | tee ../proof/swap-${ARCH}.log || true
          "$FAKE/opmspoofer.app/Contents/MacOS/opmspoofer" &
          sleep 10
          screencapture -x "../proof/final-${ARCH}.png" 2>/dev/null || true
          if pgrep -f "FakeApps/opmspoofer.app" >/dev/null; then
            echo "RELUNCH CONFIRMED ${ARCH}" | tee ../proof/relaunch-${ARCH}.txt
          else
            echo "relaunch not confirmed" | tee ../proof/relaunch-${ARCH}.txt
          fi
          CLOUD=$(curl -fsSL https://github.com/onyxxpointers/opm-dist-A8x4bZ-builds/releases/latest/download/version.txt 2>/dev/null)
          { echo "arch=${ARCH}"; echo "cloud=${CLOUD}"; echo "swap_ok=${ok}"; } > ../proof/evidence-${ARCH}.txt
          sleep 15
          osascript -e 'display dialog "UPDATE COMPLETE - now running v3.8.33" buttons {"OK"} giving up after 20' &
          sleep 12
          screencapture -x "../proof/final2-${ARCH}.png" 2>/dev/null || true
          sleep 18
          screencapture -x "../proof/final3-${ARCH}.png" 2>/dev/null || true
          wait $BURST 2>/dev/null || true
          wait $REC 2>/dev/null || true
          if [ -f ../proof/raw-${ARCH}.mov ]; then
            mv ../proof/raw-${ARCH}.mov ../proof/RAW-SCREENCAP-${ARCH}.mov
          fi
          pkill -f "FakeApps/opmspoofer.app" 2>/dev/null || true
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: mac-proof27-${{ matrix.arch }}
          path: proof/